plugins { id 'com.android.application' }
android {
    namespace 'dev.grokhome'
    compileSdk 34
    defaultConfig { applicationId 'dev.grokhome'; minSdk 30; targetSdk 34; versionCode 29; versionName '0.18.0-team-stage'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    sourceSets { main { manifest.srcFile '../packages/apps/GrokHome/AndroidManifest.xml'; java.srcDirs = ['../packages/apps/GrokHome/src']; res.srcDirs = ['../packages/apps/GrokHome/res'] } }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
